{% extends "base.html" %}

{% block title %}Excluir conquista | FORJA{% endblock %}

{% block content %}
  <h1>Excluir conquista</h1>
  <p>Deseja excluir <strong>{{ achievement.name }}</strong> de {{ game.name }}?</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="confirm" value="delete">
    <button type="submit">Confirmar exclusão</button>
  </form>
  <p><a href="{{ url_for('library.game_detail', game_id=game.id) }}">Cancelar</a></p>
{% endblock %}
