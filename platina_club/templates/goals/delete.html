{% extends "base.html" %}

{% block title %}Excluir meta | FORJA{% endblock %}

{% block content %}
  <section class="page-intro goals-intro">
    <p class="eyebrow">REMOVER META</p>
    <h1>Excluir meta</h1>
  </section>
  <section class="goal-delete-confirmation">
    <p>Tem certeza de que deseja excluir “{{ goal.objective }}”?</p>
  </section>
  <form class="goal-delete-form" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="confirm" value="delete">
    <button type="submit">Confirmar exclusão</button>
    <a class="button" href="{{ url_for('goals.list_goals') }}">Cancelar</a>
  </form>
{% endblock %}
